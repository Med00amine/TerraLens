[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralens"
version = "1.0.0"
description = "Satellite land-cover classification and mapping with deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amine Bouzoffara" }]
keywords = ["remote-sensing", "satellite-imagery", "land-cover", "deep-learning", "pytorch", "grad-cam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = ["matplotlib>=3.8"]
dev = ["terralens[train]", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
terralens = "terralens.cli:main"

[project.urls]
Homepage = "https://github.com/Med00amine/TerraLens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terralens = ["api/static/*", "api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Emitted inside torch.utils.data when pin_memory=True; not actionable here.
    "ignore:The argument 'device' of Tensor:DeprecationWarning",
    # Starlette's TestClient deprecation; tests only.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
